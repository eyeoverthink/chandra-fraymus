<!DOCTYPE html>
<html>
<head><title>Generate Extension Icons</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px">
<h3>Chandra-FRAYMUS Extension Icon Generator</h3>
<p>Right-click each canvas and "Save image as" to create the PNG icons.</p>
<div style="display:flex;gap:20px;margin-top:20px">
  <div><canvas id="c16" width="16" height="16"></canvas><p>16x16</p></div>
  <div><canvas id="c48" width="48" height="48"></canvas><p>48x48</p></div>
  <div><canvas id="c128" width="128" height="128"></canvas><p>128x128</p></div>
</div>
<script>
function draw(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#a78bfa');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${size * 0.5}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('C', size/2, size/2 + size*0.02);
}
draw('c16', 16); draw('c48', 48); draw('c128', 128);
</script>
</body>
</html>
