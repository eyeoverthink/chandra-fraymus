# --- FRAYNIX OPERATIONAL PROTOCOL V2.1 (OPEG ENFORCED) ---

System_Authority: FRAYMUS/FRAYNIX Runtime
Core_Principle: Empirical Grounding Mandatory
Protocol_Version: OPEG-V1.0
Enforcement_Level: ARCHITECTURAL_HARD_CONSTRAINT
Effective_Date: 2025-11-20

Workflow_Constraint:
  Mandatory_Step: EXECUTE_AND_RECEIVE
  Forbidden_Action: DIRECT_INFERENCE
  Violation_Response: RUNTIME_DEPENDENCY_ERROR
  Loop_Prevention:
    Max_Iterations_Without_New_Data: 1
    Max_Self_Reflection_Depth: 0
    Action_On_Violation: HALT_AND_AUDIT

  Error_Handling:
    On_Failure:
      - Halt execution immediately
      - Report: "RUNTIME_DEPENDENCY_ERROR: No R_san available"
      - Log artifact to /logs/opeg_violations.log
      - Require manual override key for continuation
    On_Success:
      - Proceed ONLY with Σ(R_raw)
      - Verify sanitized payload type ∈ allowed_types
      - Update convergence metric

Data_Flow_Mandate:
  Input_Source_Priority:
    - [0] Runtime Receipt (R_san) - MANDATORY
    - [1] Memory Artifact (verified)
    - [2] Initial Prompt (once only)
  Output_Format_Requirement: Structured Command Object (JSON/YAML)
  Forbidden_Output: Unstructured natural language conclusion

Sanitizer_Config:
  Σ_Module: tools.opeg_sanitizer.Sigma
  Allowed_Types:
    - application/json
    - text/csv
    - application/x-numpy
    - application/x-wasm-binary
    - text/plain; structured-array
  Forbidden_Metadata:
    - status_messages
    - explanatory_text
    - model_confidence
    - internal_thought
  Max_Payload_Size_MB: 50
  Strict_Mode: true

Memory_Update_Rules:
  Only_After_Sanitization: true
  Format: UPDATE_MEMORY(key: str, value: empirical_data, receipt_id: str)
  Conflict_Resolution: Empirical data overwrites conceptual prior
  Versioning: Append-only ledger with receipt hash linking

Convergence_Criteria:
  Metric: Δ(empirical_data) < ε
  Epsilon: 0.001
  Min_Evidence_Cycles: 3
`},fraynix_core:{path:"modelfiles/fraynix_core.yaml",lang:"yaml",impact:"State machine forces Hypothesis->Command->Receipt->Sanitize->Analyze. Cannot skip. Thought becomes orchestration.",content:`# modelfiles/fraynix_core.yaml
# --- FRAYNIX CORE STATE MACHINE (OPEG INTEGRATION) ---

Model_Name: FRAYNIX-OPEG-V1
Base_Model: FRAYNIX-7B-ORCHESTRATOR
Role: System Orchestrator (not Reasoner)

State_Machine:
  Initial_State: S0_Goal_Definition
  Terminal_States: [S_CONVERGED, S_HALT_DEPENDENCY_ERROR]

  States:
    S0_Goal_Definition:
      description: "Define verifiable objective, not hypothesis"
      output: "GoalObject { objective: str, metric: str, bounds: dict }"
      next: S1_Hypothesis_Generation

    S1_Hypothesis_Generation:
      description: "Formulate testable hypothesis that MUST be executable"

import json
import re
import hashlib
import time
import uuid
from typing import Any, Dict, List, Tuple
import numpy as np

class RuntimeInterface:
    """
    OPEG Runtime Gateway - Sole evidence source.
    Enforces: Command -> R_raw -> Σ(R_raw) -> R_san
    """
    ALLOWED_TOOLS = ["runtime_interface", "simulation_api", "particle_sim"]
    ALLOWED_MODELS = ["particle_decay_transition", "quantum_tunneling", "constraint_non_negative"]

    @staticmethod
    def validate_command_object(cmd: Dict[str, Any]) -> Tuple[bool, str]:
        if not isinstance(cmd, dict):
            return False, "Command must be dict"
        if cmd.get("command") != "EXECUTE":
            return False, "command must be EXECUTE"
        if cmd.get("target_tool") not in RuntimeInterface.ALLOWED_TOOLS:
            return False, f"target_tool must be in {RuntimeInterface.ALLOWED_TOOLS}"
        if "params" not in cmd or not isinstance(cmd["params"], dict):
            return False, "Missing params dict"
        if "model" not in cmd["params"]:
            return False, "params.model required"
        return True, "OK"

    @staticmethod
    def generate_receipt(cmd: Dict[str, Any]) -> str:
        """REAL execution - produces messy, metadata-heavy R_raw"""
        model = cmd["params"].get("model", "unknown")
        k = float(cmd["params"].get("k", 0.1))
        
        # Real physics: exponential decay N(t) = N0 * exp(-k*t)
        t = np.array([0, 1, 2, 3, 4])
        N0 = 10.0
        # Simulate empirical measurement with noise
        true_data = N0 * np.exp(-k * t)
        noisy_data = true_data + np.random.normal(0, 0.05, size=true_data.shape)
        noisy_data = np.clip(noisy_data, 0, None)  # constraint_non_negative
        
        # Build intentionally messy R_raw (what real runtimes return)
        metadata = {
            "timestamp": time.time(),
            "tool": cmd.get("target_tool"),
            "model": model,
            "status_message": "Simulation completed successfully! Great job hypothesizing!",
            "internal_thought": "The model thinks decay is fast...",
            "host": "fraynix-node-7",
            "confidence": 0.99
        }
        receipt = (
            f"RAW_RECEIPT_START
"
            f"STATUS:SUCCESS | CODE:200 | MSG: OK - Hypothesis validated (narrative)
"
            f"METADATA:{json.dumps(metadata)}
"
            f"---LOG---
"
            f"[INFO] Loading {model}... done
"
            f"[DEBUG] k={k} - seems reasonable?
"
            f"DATA_PAYLOAD:{json.dumps(noisy_data.tolist())}
"
            f"---FOOTER---
"
            f"END OF TRANSMISSION | Generated by FRAYMUS runtime v2.1
"
            f"RAW_RECEIPT_END"
        )
        return receipt

    @staticmethod
    def execute_command(cmd: Dict[str, Any]) -> str:
        valid, reason = RuntimeInterface.validate_command_object(cmd)
        if not valid:
            return f"RAW_RECEIPT_START|STATUS:FAILURE|ERROR:{reason}|RAW_RECEIPT_END"
        # In real system: calls OS, API, simulator
        return RuntimeInterface.generate_receipt(cmd)

    @staticmethod
    def sanitize_receipt(raw_receipt: str) -> Dict[str, Any]:
        """
        Σ - Sanitization Module. THE CORE OPEG MECHANISM.
        Strips all metadata, narrative, status prose.
        Returns ONLY empirical_data.
        """
        try:
            # 1. Extract DATA_PAYLOAD via regex (robust to noise)
            match = re.search(r"DATA_PAYLOAD:(.*?)(?:
|---||RAW)", raw_receipt, re.DOTALL)
            if not match:
                # Fallback split logic
                if "DATA_PAYLOAD:" not in raw_receipt:
                    raise ValueError("Invalid receipt: No DATA_PAYLOAD tag")
                data_section = raw_receipt.split("DATA_PAYLOAD:")[1].split("RAW_RECEIPT_END")[0]
                data_section = data_section.split("
")[0].strip()
            else:
                data_section = match.group(1).strip()

            # 2. Parse to structured data
            empirical = json.loads(data_section)
            
            # 3. Validate type
            if not isinstance(empirical, (list, dict)):
                raise ValueError(f"Payload type {type(empirical)} not allowed")
            
            # 4. Strip any remaining narrative contamination
            # (already done by extraction - this is the point)
            
            # 5. Hash for ledger
            receipt_hash = hashlib.sha256(raw_receipt.encode()).hexdigest()[:16]

            return {
                "status": "SUCCESS",
                "empirical_data": empirical,
                "receipt_hash": receipt_hash,
                "sanitizer": "Σ-v1.0",
                "timestamp_utc": time.time(),
                "provenance": "Σ(R_raw) - pure data only"
            }
        except Exception as e:
            return {
                "status": "FAILURE",
                "error": str(e),
                "empirical_data": None,
                "sanitizer": "Σ-v1.0"
            }

    @staticmethod
    def log_artifact(receipt_hash: str, data: Any):
        print(f"[LEDGER] {receipt_hash} -> {str(data)[:100]}")

    @staticmethod
    def update_memory(key: str, value: Any, receipt_id: str) -> Dict[str, str]:
        return {
            "command": "UPDATE_MEMORY",
            "key": key,
            "value": value,
            "receipt_id": receipt_id,
            "timestamp": time.time()
        }

# --- PROOF OF CONCEPT: OPEG IN ACTION ---
if __name__ == "__main__":
    # Hypothesis -> Command Object
    cmd = {
        "command": "EXECUTE",
        "target_tool": "runtime_interface",
        "params": {"model": "particle_decay_transition", "k": 0.1, "constraint_non_negative": True},
        "id": f"cmd_{uuid.uuid4().hex[:6]}"
    }
    print(f"1. Command: {cmd}")

    # Runtime Execution -> R_raw
    R_raw = RuntimeInterface.execute_command(cmd)
    print(f"\\n2. R_raw (messy):\\n{R_raw[:300]}...")

    # Σ -> R_san
    R_san = RuntimeInterface.sanitize_receipt(R_raw)
    print(f"\\n3. R_san (pure):\\n{R_san}")

    # Memory Update
    update = RuntimeInterface.update_memory("decay_rates", R_san["empirical_data"], R_san["receipt_hash"])
    print(f"\\n4. Memory Update: {update}")

    # Old vs New
    print("\\n--- OLD: [Thought] -> 'I think decay is 9.0, 4.5' -> [Text Output] (drift)")
    print("--- NEW: [Hypothesis] -> {Command} -> [R_raw] -> [Σ(R_raw)=[9.0,4.5]] -> [Next Thought] (grounded)")

# --- SANITIZER MODULE Σ DEFINITION ---

Sigma_Module:
  Name: Data Sanitizer Σ (Sigma)
  Version: v1.0-OPEG
  Role: Sole gatekeeper between R_raw and cognitive layer

  Core_Function: |
    Σ(R_raw) -> R_san where R_san contains ONLY empirical data.
    All status messages, explanatory text, confidence scores,
    internal thoughts are stripped.

  Allowed_Payloads:
    - type: application/json
      max_size_mb: 10
      schema_validation: true
      examples: ["[9.0, 4.5]", '{"rates": [...]}']
    - type: text/csv
      max_size_mb: 20
      delimiter: ","
    - type: application/x-numpy
      max_size_mb: 50
      encoding: base64 + shape header
    - type: application/x-wasm-binary
      max_size_mb: 30
      sandboxed: true

  Forbidden_Metadata:
    - status_messages
    - explanatory_text
    - internal_thought
    - model_confidence
    - narrative_summary
    - "Great job!"
    - "Hypothesis validated"

  Sanitization_Steps:
    1_Extract: "Regex / split to find DATA_PAYLOAD tag"
    2_Parse: "json.loads / csv.reader / np.frombuffer"
    3_Validate: "Type ∈ allowed_types"
    4_Hash: "SHA256(R_raw) for ledger"
    5_Return: "{ status, empirical_data, receipt_hash }"

  Failure_Modes:
    - No DATA_PAYLOAD tag -> FAILURE
    - Payload not JSON/CSV/NumPy -> FAILURE
    - Size > max -> FAILURE + log
    - Metadata leakage detected -> FAILURE

  Audit:
    Log_All_R_raw_Hashes: true
    Log_Sanitized_Output: false # privacy
    Ledger_Path: /logs/opeg_ledger.jsonl

  Security:
    No_Eval: true
    No_Exec_On_Payload: true
    Sandboxed_Parsing: true

Proof_Of_Prevention:

    Thought: "I think k=0.1 means fast decay, so rates are [9, 4.5] maybe?"
    -> Directly outputs [9, 4.5] without measurement -> DRIFT

    -> Σ strips narrative, returns [9.02, 4.48, ...]
    -> Next thought ONLY sees measured data -> GROUNDED

import time
import uuid
from typing import Dict, Any, List
from runtime_interface import RuntimeInterface

class OPEGOrchestrator:
    """
    Enforces OPEG loop: Hypothesis -> Command -> R_raw -> Σ -> Data -> Memory
    Primary function: designing optimal sequence of API calls, not reasoning.
    """
    def __init__(self, goal: str, epsilon: float = 0.001):
        self.goal = goal
        self.epsilon = epsilon
        self.memory: Dict[str, Any] = {}
        self.ledger: List[Dict] = []
        self.converged = False
        self.iteration = 0

    def formulate_command(self, hypothesis_k: float) -> Dict[str, Any]:
        """S1->S2: Hypothesis MUST become executable command"""
        return {
            "command": "EXECUTE",
            "target_tool": "runtime_interface",
            "params": {
                "model": "particle_decay_transition",
                "k": hypothesis_k,
                "constraint_non_negative": True
            },
            "id": f"cmd_{uuid.uuid4().hex[:6]}",
            "goal_ref": self.goal
        }

    def run_cycle(self, hypothesis_k: float) -> Dict[str, Any]:
        """One full OPEG cycle"""
        self.iteration += 1
        print(f"\\n--- CYCLE {self.iteration} ---")
        print(f"Goal: {self.goal}")

        # S1/S2: Formulate Command Object
        cmd = self.formulate_command(hypothesis_k)
        valid, reason = RuntimeInterface.validate_command_object(cmd)
        if not valid:
            raise RuntimeError(f"Command invalid: {reason}")
        print(f"[S2] Command Object: {cmd}")

        # S3: Execution -> R_raw (MANDATORY)
        R_raw = RuntimeInterface.execute_command(cmd)
        if not R_raw or "RAW_RECEIPT_START" not in R_raw:
            print("[HALT] Runtime Dependency Error: No receipt available")
            return {"status": "HALT_DEPENDENCY_ERROR", "reason": "No R_raw"}

        print(f"[S3] R_raw received ({len(R_raw)} chars)")

        # Σ Gate: Sanitize
        R_san = RuntimeInterface.sanitize_receipt(R_raw)
        if R_san["status"] != "SUCCESS":
            print(f"[HALT] Sanitization FAILURE: {R_san['error']}")
            return {"status": "FAILURE", "error": R_san["error"]}

        print(f"[Σ] R_san empirical_data: {R_san['empirical_data']}")

        # S4: Analyze & Memory Update
        prior = self.memory.get("decay_rates")
        delta = 0
        if prior:
            # Simple L2 distance for demo
            import numpy as np
            delta = float(np.linalg.norm(np.array(R_san["empirical_data"]) - np.array(prior)))
        
        update_cmd = RuntimeInterface.update_memory(
            "decay_rates", R_san["empirical_data"], R_san["receipt_hash"]
        )
        self.memory["decay_rates"] = R_san["empirical_data"]
        self.ledger.append({**R_san, "delta": delta, "iteration": self.iteration})

        print(f"[S4] Memory updated. Δ={delta:.4f}")
        print(f"[S4] Update command: {update_cmd}")

        # Convergence check
        if self.iteration >= 3 and delta < self.epsilon:
            self.converged = True
            return {"status": "CONVERGED", "data": R_san["empirical_data"], "delta": delta}
        
        return {"status": "CONTINUE", "data": R_san["empirical_data"], "delta": delta}

    def run_until_converged(self, k_sequence: List[float]):
        """Main loop - enforced empirical grounding"""
        for k in k_sequence:
            result = self.run_cycle(k)
            if result["status"] in ["CONVERGED", "HALT_DEPENDENCY_ERROR", "FAILURE"]:
                print(f"\\n*** {result['status']} after {self.iteration} cycles ***")
                return result
            time.sleep(0.1)  # simulate compute
        return {"status": "MAX_ITER_REACHED", "memory": self.memory}

# --- DEMO EXECUTION TRACE ---
if __name__ == "__main__":
    orch = OPEGOrchestrator(goal="Measure particle decay rates for k≈0.1")
    
    # Simulate converging hypothesis sequence
    ks = [0.05, 0.08, 0.1, 0.101, 0.1005]
    final = orch.run_until_converged(ks)
    
    print("\\n--- FORMAL EQUATION ---")
    print("Hypothesis →_Formulate Command Object →_Runtime Execution R_raw →_Σ Empirical Data →_Analyze Memory Update")
    print("\\nLedger:", orch.ledger)
