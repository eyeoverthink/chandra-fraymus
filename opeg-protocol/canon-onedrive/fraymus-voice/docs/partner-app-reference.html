function extractMemory(text, prev) {
  const Y = text.toLowerCase();
  const next = { ...prev };
  let changed = false;

  const snackMatch = Y.match(/favorite snack is (.+)|my snack is (.+)|i love (.+) snack|snack(?: is|:)? (.+)/i);
  if (snackMatch) {
    const fe = (snackMatch[1] || snackMatch[2] || snackMatch[3] || snackMatch[4] || "")
      .split(/[.!?]/)[0].trim().slice(0, 30);
    if (fe && fe.length > 1 && fe.length < 30) {
      next.snack = fe;
      changed = true;
    }
  }
  const classMatch = Y.match(/class is (.+)|class going (.+)|class feels (.+)/i);
  if (classMatch) {
    const gr = (classMatch[1] || classMatch[2] || classMatch[3] || "")
      .split(/[.!?]/)[0].trim().slice(0, 40);
    if (gr) {
      next.classMood = gr;
      changed = true;
    }
  }
  const nameMatch = Y.match(/call me (.+)|my name is (.+)/i);
  if (nameMatch) {
    const nm = (nameMatch[1] || nameMatch[2] || "").split(/[.!?]/)[0].trim().slice(0, 20);
    if (nm) {
      next.userName = nm;
      changed = true;
    }
  }
  return { memory: next, changed };
}

/* ================= VOICE LAYER — webspeech today, Dessa drop-in when it ships =================
   Architecture (per owner directive 2026-10-25): Block's Dessa (block.xyz/dessa) is a local
   full-duplex speech-to-speech model (M4 Max+ Macs). No public API/weights yet (tracker:
   getdessa.com). This layer ships a REAL working voice loop now (Web Speech API) and
   auto-switches to a local Dessa endpoint the day it appears:
     contract: GET  {dessaEndpoint}/health -> {"ok":true}
               POST {dessaEndpoint}/listen {audio: base64} -> {text}
               POST {dessaEndpoint}/speak  {text, voice}   -> audio bytes
   Everything else in the app is engine-agnostic. */
const PARTNER_VOICE = (() => {
  const st = {
    engine: "webspeech",            // or "dessa" after probe
    dessaEndpoint: "http://127.0.0.1:9099",
    recognized: false, listening: false, rec: null,
  };
  async function probeDessa() {
    try {
      const r = await fetch(st.dessaEndpoint + "/health", { signal: AbortSignal.timeout(1500) });
      const j = await r.json();
      st.engine = j.ok ? "dessa" : "webspeech";
    } catch (_) { st.engine = "webspeech"; }
    return st.engine;
  }
  function listen(onFinal, onStatus) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onStatus && onStatus("No SpeechRecognition in this browser — try Chrome/Edge"); return; }
    if (st.listening) { stop(); return; }
    const rec = new SR();
    rec.lang = (navigator.language || "en-US");
    rec.continuous = false; rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      onStatus && onStatus(final || interim || "…");
      if (final) { st.listening = false; onStatus && onStatus(null); onFinal(final.trim()); }
    };
    rec.onend = () => { if (st.listening) { st.listening = false; onStatus && onStatus(null); } };
    rec.onerror = (e) => { st.listening = false; onStatus && onStatus(e.error === "not-allowed" ? "mic blocked — allow microphone" : e.error); };
    st.rec = rec; st.listening = true;
    try { rec.start(); } catch (_) {}
  }
  function stop() { try { st.rec && st.rec.stop(); } catch (_) {} st.listening = false; }
  async function speak(text, onDone) {
    if (!text) return;
    if (st.engine === "dessa") {
      try {
        const r = await fetch(st.dessaEndpoint + "/speak", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice: "partner" }) });
        const blob = await r.blob();
        const a = new Audio(URL.createObjectURL(blob));
        a.onended = () => onDone && onDone(); a.play();
        return;
      } catch (_) { /* fall through to webspeech */ }
    }
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const pick = speechSynthesis.getVoices().find(v => /Samantha|Ava|Jasmine|Aria|Google US English/i.test(v.name));
    if (pick) u.voice = pick;
    u.rate = 1.02; u.pitch = 1.04;
    u.onend = () => onDone && onDone();
    speechSynthesis.speak(u);
  }
  return { listen, stop, speak, probeDessa, get engine() { return st.engine; }, get listening() { return st.listening; } };
})();
window.PARTNER_VOICE = PARTNER_VOICE;
window.addEventListener("load", () => PARTNER_VOICE.probeDessa());

${memoryContext}` : "")
            },
            ...messages.slice(-8).map((m) => ({ role: m.role, content: m.text })),
            { role: "user", content: text }
          ],
          stream: true
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: ctrl.signal
        });
        if (!res.ok || !res.body) throw new Error("ollama failed");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let acc = "";
        let first = true;
        const id = (Date.now() + 1).toString();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunks = decoder.decode(value, { stream: true }).split("\n").filter(Boolean);
          for (const line of chunks) {
            try {
              const j = JSON.parse(line);
              const piece = j?.message?.content || j?.response || "";
              if (piece) {
                acc += piece;
                if (first) {
                  setTyping(false);
                  setMessages((m) => [...m, { id, role: "assistant", text: acc, ts: Date.now() }]);
                  if (window.PARTNER_VOICE && speakOnRef.current) PARTNER_VOICE.speak(acc);
                  fetch("http://127.0.0.1:9099/memory", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: name + " replied: " + acc }) }).catch(() => {});
                  first = false;
                } else {
                  setMessages((m) => m.map((x) => (x.id === id ? { ...x, text: acc } : x)));
                }
              }
            } catch {}
          }
        }
        setTyping(false);
        return;
      } catch (err) {
        if (err.name === "AbortError") {
          setTyping(false);
          return;
        }
        console.log("Ollama chat failed, falling back to mock", err);
      }
    }

    // Mock path
    const delay = 700 + Math.random() * 700 + Math.min(400, text.length * 10);
    setTimeout(() => {
      const reply = mockReply({
        input: text,
        personality,
        name,
        clinginess,
        jealous,
        memory: newMem
      });
      setMessages((m) => [...m, { id: (Date.now() + 1).toString(), role: "assistant", text: reply, ts: Date.now() }]);
      if (window.PARTNER_VOICE && speakOnRef.current) PARTNER_VOICE.speak(reply);
      setTyping(false);
      setMood((m) => {
        if (text.toLowerCase().includes("fighting") || text.toLowerCase().includes("mad")) {
          return Math.max(20, m - 12);
        }
        return Math.min(100, Math.max(10, m + (Math.random() * 6 - 2)));
      });
    }, delay);
  };

    setMessages([intro]);
    showToast("Chat cleared");
  };

  const exportChat = () => {
    const lines = messages.map((m) => {
      const who = m.role === "user" ? "You" : name;
      const time = new Date(m.ts).toLocaleString();
      return `[${time}] ${who}: ${m.text}`;
    }).join("\n\n");
    const blob = new Blob([lines], { type: "text/plain" });

                <button onClick={exportChat} style={{ flex: 1, padding: "8px 0", borderRadius: 12, fontSize: 12, fontWeight: 700, background: "rgba(255,255,255,0.12)", color: "#fff" }}>

        {/* Chat */}
        <div style={{

                </div>
                <div style={{

                  background: status === "connected" ? "#22c55e" : accent,

              {typing && (
                <div style={{ display: "flex", justifyContent: "flex-start" }}>
                  <div className="bubble-partner" style={{ padding: "12px 16px", fontSize: 14 }}>
                    <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                      <span className="dot-pulse" style={{ animationDelay: "0s" }} />
                      <span className="dot-pulse" style={{ animationDelay: "0.15s" }} />
                      <span className="dot-pulse" style={{ animationDelay: "0.3s" }} />
                      <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, color: "var(--muted)" }}>{name} is typing…</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Quick prompts */}
          <div style={{
            padding: "10px 16px", borderTop: "1px solid var(--border)",
            overflowX: "auto", background: "var(--surface)", display: "flex", gap: 8, whiteSpace: "nowrap"
          }}>
            {QUICK_PROMPTS.map((q) => (
              <button
                key={q}
                onClick={() => send(q)}
                style={{
                  flexShrink: 0, padding: "6px 14px", borderRadius: 99, fontSize: 12, fontWeight: 700,
                  border: "1px solid var(--border)", background: "var(--bg)"
                }}
              >
                {q}
              </button>
            ))}
          </div>

          {/* Composer */}
          <div style={{ padding: 16, borderTop: "1px solid var(--border)", background: "var(--surface)" }}>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
              <button
                onClick={() => {
                  if (listening) { PARTNER_VOICE.stop(); setListening(false); setTranscript(""); return; }
                  setListening(true); setTranscript("… listening");
                  PARTNER_VOICE.listen(
                    (final) => { setListening(false); setTranscript(""); if (final) { setInput(final); setTimeout(() => send(), 60); } },
                    (t) => setTranscript(t || ""));
                }}
                title="Voice input — webspeech now, auto-switches to local Dessa when it ships"
                style={{
                  width: 40, height: 40, borderRadius: 99, flexShrink: 0, fontSize: 16,
                  border: "1px solid var(--border)", cursor: "pointer",
                  background: listening ? "rgba(255,60,60,0.55)" : "var(--bg)",
                  animation: listening ? "pulse 1.2s infinite" : "none"
                }}
              >
                {listening ? "⏹" : "🎙"}
              </button>
              <div style={{ flex: 1, position: "relative" }}>
                <input
                  value={transcript || input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                      e.preventDefault();
                      send();
                    }
                  }}
                  placeholder={`Message ${name}... (try "FRAYMUS" or your favorite snack)`}
                  style={{
                    width: "100%", borderRadius: 18, border: "1px solid var(--border)",
                    padding: "14px 48px 14px 16px", fontSize: 14, background: "var(--bg)", outline: "none"
                  }}
                />
                <button
                  onClick={() => send()}
                  disabled={!input.trim() || typing}
                  style={{
                    position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)",
                    width: 36, height: 36, borderRadius: 99, display: "flex", alignItems: "center",
                    justifyContent: "center", color: "#fff", fontWeight: 700, background: accent,
                    opacity: !input.trim() || typing ? 0.4 : 1
                  }}
                >
                  ↑
                </button>
              </div>
            </div>
            <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <div style={{ fontSize: 10, color: "var(--muted)", lineHeight: 1.3 }}>
                Runs local · chats stay on device · voice: {listening ? "listening…" : transcript || voiceEngine}
                {voiceEngine === "dessa" ? " (DESSA ✓)" : ""}
              </div>
              <div style={{ display: "flex", gap: 6, fontSize: 10, fontWeight: 700 }}>
                <button
                  onClick={() => setSpeakOn(!speakOn)}
                  title="Speak replies out loud (webspeech voice now; Dessa voice when it ships)"
                  style={{ padding: "4px 8px", borderRadius: 99, border: "1px solid var(--border)",
                           background: speakOn ? "rgba(120,255,160,0.25)" : "transparent", cursor: "pointer" }}>
                  {speakOn ? "🔊 ON" : "🔇 OFF"}
                </button>
                <span style={{ padding: "4px 8px", borderRadius: 99, border: "1px solid var(--border)" }}>↵ Send</span>
              </div>
            </div>
          </div>
        </div>
      </main>

      {/* Footer */}
      <footer style={{ maxWidth: 1280, margin: "0 auto", padding: "8px 16px 32px" }}>
        <div style={{
          borderRadius: 18, padding: 16, display: "flex", flexWrap: "wrap", gap: 12,
          alignItems: "center", justifyContent: "space-between",
          background: "var(--surface)", border: "1px solid var(--border)", boxShadow: "var(--shadow-soft)"
        }}>
          <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
            <div style={{
              width: 32, height: 32, borderRadius: 99, background: "var(--text)",
              color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 14, flexShrink: 0
            }}>φ</div>
            <div>
              <div style={{ fontSize: 12, fontWeight: 800 }}>Disclaimer — Parody Demo for Class</div>
              <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 2, maxWidth: 680, lineHeight: 1.4 }}>
                This is a parody demo for class, not a real relationship. Built on FRAYMUS Continuity Engine — runs local, your chats stay on device. No explicit content. Encourages healthy boundaries: Go touch grass, I’ll be here when you get back, charging. For educational / comedy purposes only.
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <span style={{ fontSize: 11, padding: "6px 12px", borderRadius: 99, fontWeight: 700, border: "1px solid var(--border)", background: "var(--bg)" }}>
              Class-Safe · Wholesome
            </span>
            <span style={{ fontSize: 11, padding: "6px 12px", borderRadius: 99, fontWeight: 700, color: "#fff", background: "var(--text)" }}>
              Demo Ready ✨
            </span>
          </div>
        </div>
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 10, fontFamily: "ui-monospace, monospace", color: "var(--muted)" }}>
          My AI Partner™ · Improved · Totally Not Clingy Significant Other Simulator · For Class Demo Only · {new Date().getFullYear()}
        </div>
      </footer>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);
  </script>
</body>
</html>
